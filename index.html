<style>
:root{--bg:#080d19;--card:#151d31;--line:#2a3857;--text:#f5f7ff;--muted:#aeb9d1;--green:#31d158;--red:#ff453a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080d19,#11192c);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{padding:22px 16px 15px;position:sticky;top:0;z-index:10;background:rgba(8,13,25,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}

.tabs button.active{background:var(--green);color:#06120a;border-color:var(--green)}.card{background:rgba(21,29,49,.96);border:1px solid var(--line);border-radius:21px;padding:16px;margin:11px 0}
h2{margin:0 0 6px;font-size:22px}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.success{background:#123b1c!important;border-color:#2a7d3c!important;color:#9bffa9!important}.danger{background:#411920!important;border-color:#8a2d38!important;color:#ff9c96!important}
select{background:#0c1425;color:var(--text);border:1px solid #405070;border-radius:12px;padding:10px 12px;font-size:16px;font-weight:700}
.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:center}th{color:var(--muted);font-size:13px}th:nth-child(2),td:nth-child(2){text-align:left}
tr.me td{background:rgba(49,209,88,.11);font-weight:900}.points{font-weight:900;font-size:17px}
.match{display:grid;grid-template-columns:minmax(0,1fr) 52px 20px 52px minmax(0,1fr);align-items:center;gap:7px;padding:10px 0;border-bottom:1px solid var(--line)}
.team{font-weight:800}.away{text-align:right}.score{width:52px;background:#0a1222;color:white;border:1px solid #465675;border-radius:10px;padding:9px 4px;text-align:center;font-size:17px;font-weight:900}
.dash{color:var(--muted);text-align:center}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#25324d;color:var(--muted);font-size:12px;font-weight:800}
.teamgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.teamcard{background:#10182a;border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:800}
.hidden{display:none!important}.note{font-size:13px;color:var(--muted);line-height:1.45}footer{text-align:center;color:var(--muted);padding:25px 0}
@media(max-width:600px){h1{font-size:27px}.card{border-radius:18px}.teamgrid{grid-template-columns:1fr}.match{grid-template-columns:minmax(0,1fr) 48px 18px 48px minmax(0,1fr)}.score{width:48px}}
</style></head><body>
<header><h1>⚽ FCND-Kickbase</h1><div class="subtitle">10 Mannschaften · 34 Spieltage · H2H</div></header>

<section id="matchdays" class="tab hidden"><div class="card"><h2>Spieltage</h2><select id="matchday" onchange="renderMatchday()"></select><div id="matchList"></div><div class="actions"><button class="btn success" onclick="saveMatchday()">💾 Ergebnisse speichern</button></div></div></section>
<section id="teams" class="tab hidden"><div class="card"><h2>Mannschaften</h2><div class="teamgrid" id="teamList"></div></div></section>
<footer>FCND-Kickbase · 10 Teams · 34 Spieltage · H2H</footer>
</main>

function tab(id,b){document.querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(id==="table")renderTable();if(id==="matchdays")renderMatchday()}
function stats(){const s={};TEAMS.forEach(t=>s[t]={sp:0,s:0,u:0,n:0,tore:0,geg:0,pkt:0});MATCHES.forEach((m,i)=>{const r=results[i];if(!r||r.home===""||r.away==="")return;const hg=+r.home,ag=+r.away;if(!Number.isInteger(hg)||!Number.isInteger(ag)||hg<0||ag<0)return;s[m.home].sp++;s[m.away].sp++;s[m.home].tore+=hg;s[m.home].geg+=ag;s[m.away].tore+=ag;s[m.away].geg+=hg;if(hg>ag){s[m.home].s++;s[m.away].n++;s[m.home].pkt+=3}else if(ag>hg){s[m.away].s++;s[m.home].n++;s[m.away].pkt+=3}else{s[m.home].u++;s[m.away].u++;s[m.home].pkt++;s[m.away].pkt++}});return s}

function saveMatchday(){const md=+document.getElementById("matchday").value;MATCHES.map((m,i)=>({...m,i})).filter(m=>m.md===md).forEach(m=>{const h=document.getElementById("h"+m.i).value.trim(),a=document.getElementById("a"+m.i).value.trim();if(h!==""&&a!=="")results[m.i]={home:h,away:a};else delete results[m.i]});localStorage.setItem(KEY,JSON.stringify(results));renderTable();alert("Ergebnisse gespeichert ✅")}
